<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SelfExplorer - OnlyOffice Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    #placeholder { width: 100%; height: 100%; }
    .loading { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-family: sans-serif; color: #666; }
  </style>
</head>
<body>
  <div id="placeholder"><div class="loading">エディタを読み込み中...</div></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const filePath = params.get('path');
    const placeholder = document.getElementById('placeholder');
    function showError(msg) {
      placeholder.textContent = '';
      const div = document.createElement('div');
      div.className = 'loading';
      div.textContent = msg;
      placeholder.appendChild(div);
    }
    if (!filePath) {
      showError('ファイルが指定されていません');
    } else {
      fetch(`/api/onlyoffice/config?path=${encodeURIComponent(filePath)}`)
        .then(r => r.json())
        .then(data => {
          if (!data.success) { showError(`エラー: ${data.error}`); return; }
          const script = document.createElement('script');
          script.src = `${data.editorUrl}/web-apps/apps/api/documents/api.js`;
          script.onload = () => { try { new DocsAPI.DocEditor('placeholder', data.config); } catch (e) { showError(`エディタの初期化に失敗しました: ${e.message}`); } };
          script.onerror = () => { showError('OnlyOffice スクリプトの読み込みに失敗しました'); };
          document.head.appendChild(script);
        })
        .catch(e => { showError(`エラー: ${e.message}`); });
    }
  </script>
</body>
</html>
